org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1024M -Dkotlin.daemon.jvm.options\="-Xmx4096M" -XX:+UseParallelGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
org.gradle.unsafe.configuration-cache=true
android.nonTransitiveRClass=false

# Multi-core parallel execution on CI
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.daemon=true
org.gradle.configureondemand=false
org.gradle.caching=true

# Suppress deprecated warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds
android.suppressUnsupportedCompileSdk=37.0

# Increase timeouts for JitPack downloads
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
