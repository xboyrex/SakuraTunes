name: Build PR

on:
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate PR debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/pr-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Sakura Tunes PR ${{ github.event.number }},O=Sakura Tunes,C=IN"

      - name: Build GMS Debug APK
        run: ./gradlew --console=plain assembleGmsDebug --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SAKURA_APPLICATION_ID: com.sakuratunes.music.pr.p${{ github.event.number }}
          SAKURA_APP_NAME: Sakura Tunes PR ${{ github.event.number }}
          SAKURA_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SakuraTunes-debug-pr-${{ github.event.number }}
          path: app/build/outputs/apk/gms/debug/*.apk
