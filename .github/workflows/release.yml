name: Bump to new version
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    if: "!contains(github.ref, 'refs/tags')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
      version_code: ${{ steps.check_version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check_version
        run: |
          NEW_VERSION=$(grep -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1 | tr -d '[:space:]' || true)
          NEW_VERSION="${NEW_VERSION:-2.0.0}"
          if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$ ]]; then
            NEW_VERSION="2.0.0"
          fi
          VERSION_CODE=$(grep -oP '^\s*versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -n 1 | tr -d '[:space:]' || echo "200")
          echo "version_changed=true" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

  build:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - variant: foss
            variantName: Foss
          - variant: gms
            variantName: Gms
          - variant: izzy
            variantName: Izzy

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Release Keystore
        env:
          SECRET_KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          mkdir -p app/keystore
          if [ -n "$SECRET_KEYSTORE" ]; then
            echo "$SECRET_KEYSTORE" | base64 -d > app/keystore/release.keystore
          else
            keytool -genkeypair -v \
              -keystore app/keystore/release.keystore \
              -alias sakuratunes \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass sakuratunes123 \
              -keypass sakuratunes123 \
              -dname "CN=xboyrex, OU=SakuraTunes, O=xboyrex, L=Patna, S=BR, C=IN"
          fi

      - name: Build Release APK
        run: ./gradlew --console=plain assemble${{ matrix.variantName }}Release --warning-mode summary
        env:
          SAKURA_APPLICATION_ID: com.sakuratunes.music
          SAKURA_APP_NAME: Sakura Tunes
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || 'sakuratunes123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'sakuratunes' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'sakuratunes123' }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Move and rename signed APKs
        run: |
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "$OUTPUT_DIR/out"
          SIGNED_APK=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.apk" | head -1)

          if [ "${{ matrix.variant }}" = "gms" ]; then
            TARGET_NAME="SakuraTunes-with-Google-Cast.apk"
          elif [ "${{ matrix.variant }}" = "izzy" ]; then
            TARGET_NAME="SakuraTunes-izzy.apk"
          else
            TARGET_NAME="SakuraTunes.apk"
          fi

          cp "$SIGNED_APK" "$OUTPUT_DIR/out/$TARGET_NAME"
          ls -la "$OUTPUT_DIR/out/"

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.variant == 'gms' && 'SakuraTunes-with-Google-Cast' || matrix.variant == 'izzy' && 'SakuraTunes-izzy' || 'SakuraTunes' }}
          path: app/build/outputs/apk/${{ matrix.variant }}/release/out/*.apk

  create-release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all APKs
        uses: actions/download-artifact@v7
        with:
          path: downloaded_artifacts/

      - name: Organize APKs for release
        run: |
          mkdir -p release_files
          find downloaded_artifacts -name "*.apk" -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Parse release notes from changelog
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          chmod +x .github/scripts/parse_changelog.sh
          if bash .github/scripts/parse_changelog.sh "$VERSION" changelog.md > release_notes.md; then
            echo "Release notes sourced from changelog.md"
          else
            echo "Release of version $VERSION" > release_notes.md
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.check-version.outputs.new_version }}"
          if ! git check-ref-format "refs/tags/$TAG" ; then
            echo "::error::Refusing to publish — '$TAG' is not a valid git tag"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_files/*.apk --clobber
            gh release edit "$TAG" --notes-file release_notes.md --latest
          else
            gh release create "$TAG" \
              --title "Sakura Tunes $TAG" \
              --notes-file release_notes.md \
              --latest \
              release_files/*.apk
          fi

      - name: Sync README release details
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/sync_readme.py
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: sync latest release metadata"
            git push
          fi
