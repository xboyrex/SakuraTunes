name: Bug report
description: Report a reproducible problem in Sakura Tunes.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include passwords, API keys, session cookies, or personal data.
  - type: input
    id: version
    attributes:
      label: App version
      description: Include the version name and build variant.
      placeholder: "2.0.0 · GMS"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "POCO F7 · Android 16"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List exact steps so the issue can be reproduced.
      placeholder: "1. Open ...\n2. Tap ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, account identifiers, and private information before attaching logs.
    validations:
      required: false
